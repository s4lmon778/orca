name: Fork macOS installer (unsigned)

# Personal-fork build of the patched app: ad hoc signed, not notarized, no auto-update channel.
# The orcad deployment template comes from the official release, as for the patched Windows install.

on:
  push:
    branches: [build/macos-installer]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fork-macos-installer
  cancel-in-progress: true

env:
  OFFICIAL_RELEASE: v1.4.272
  ORCA_BACKGROUND_LAUNCH: '1'

jobs:
  build:
    if: github.repository == 's4lmon778/orca'
    runs-on: macos-15
    timeout-minutes: 150
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/setup@v2
        with:
          install: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          check-latest: true
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --cpu=current,x64,arm64

      - uses: ./.github/actions/install-mobile-dependencies

      - name: Build app sources and macOS helpers
        run: |
          pnpm run build:desktop
          pnpm run build:computer-macos
          pnpm run build:keyboard-layout-macos
          pnpm run build:process-footprint-macos
          pnpm run build:notification-status-macos

      - name: Download the official apps (for their orcad templates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          v="${OFFICIAL_RELEASE#v}"
          gh release download "$OFFICIAL_RELEASE" --repo stablyai/orca \
            --pattern "Orca-$v-arm64-mac.zip" --pattern "Orca-$v-mac.zip" --dir "$RUNNER_TEMP/official"
          ditto -x -k "$RUNNER_TEMP/official/Orca-$v-arm64-mac.zip" "$RUNNER_TEMP/official/arm64"
          ditto -x -k "$RUNNER_TEMP/official/Orca-$v-mac.zip" "$RUNNER_TEMP/official/x64"
          ls "$RUNNER_TEMP/official"/*/Orca.app/Contents/Resources/orcad-template

      - name: Package, ad hoc seal and make a dmg per architecture
        run: |
          set -euo pipefail
          pnpm run ensure:electron-runtime
          read -r ORCA_BUILD_COMMIT ORCA_LOCAL_BUILD_VERSION < <(node --input-type=module -e \
            "import { getLocalBuildIdentity as g } from './config/scripts/desktop-distribution/macos/build-mac-local.mjs'; const i = g(); console.log(i.commit, i.version)")
          export ORCA_BUILD_COMMIT ORCA_LOCAL_BUILD_VERSION
          mkdir -p installers
          for arch in arm64 x64; do
            # Each slice verifies its template against its own agent-browser driver.
            rm -rf out/orcad-template
            ditto "$RUNNER_TEMP/official/$arch/Orca.app/Contents/Resources/orcad-template" out/orcad-template
            pnpm exec electron-builder --config config/electron-builder.config.cjs --mac dir --$arch
            dir=$([ "$arch" = arm64 ] && echo dist/mac-arm64 || echo dist/mac)
            app="$dir/Orca.app"
            if ! codesign --verify --strict "$app" 2>/dev/null; then
              codesign --force --sign - "$app" || codesign --force --deep --sign - "$app"
            fi
            codesign --verify --verbose=2 "$app"
            stage="$RUNNER_TEMP/dmg-$arch"
            rm -rf "$stage" && mkdir -p "$stage"
            ditto "$app" "$stage/Orca.app"
            ln -s /Applications "$stage/Applications"
            hdiutil create -volname "Orca (patched)" -srcfolder "$stage" -ov -format UDZO \
              "installers/Orca-patched-macos-$arch.dmg"
          done
          ls -la installers dist

      - uses: actions/upload-artifact@v7
        with:
          name: orca-patched-macos-installers
          path: installers/*.dmg
          retention-days: 30
          compression-level: 0

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: orca-patched-macos-installers
          path: installers

      - name: Publish a release on the fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${GITHUB_SHA::10}"
          tag="patched-macos-$short"
          cat > notes.md <<EOF
          Patched Orca for macOS, built from \`$short\` on \`$GITHUB_REF_NAME\`.

          Adds task groups with folders, the worktree chevron, child folders as projects, and the
          Windows Claude model-list fix on top of upstream main.

          **Which file:** \`Orca-patched-macos-arm64.dmg\` for Apple Silicon (M1 and later), \`Orca-patched-macos-x64.dmg\` for Intel.

          **First launch:** this build is not notarized. Drag Orca to Applications, then run
          \`xattr -dr com.apple.quarantine /Applications/Orca.app\` once (or right-click Orca, Open).
          It replaces an official Orca install and does not auto-update.
          EOF
          sed -i 's/^          //' notes.md
          gh release create "$tag" installers/*.dmg --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Orca patched for macOS ($short)" --notes-file notes.md --latest
